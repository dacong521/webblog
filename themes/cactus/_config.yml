##############################################################################
# 站点内容与导航
##############################################################################

# 「项目」栏目跳转地址（站内页面或外部链接都可以）
projects_url: /projects/

direction: ltr

# 导航菜单：按下面的顺序渲染，值支持站内路径或完整外链
nav:
  home: /
  articles: /archives/
  life: /diary/
  about: /about/  
  projects: /projects/

# 导航栏文字小图标（放在 source/images/ 下，相对站点根目录）
nav_icons:
  home: /images/nav-home.svg
  about: /images/nav-about.svg
  articles: /images/nav-writing.svg
  life: /images/nav-life.svg
  projects: /images/nav-projects.svg

# 首页「在这里找到我」后面的社交图标
social_links:
  -
    icon: github
    label: GitHub
    link: https://github.com/yourname
  -
    icon: mail
    label: 邮件
    link: mailto:sdkiss2012@163.com

# 首页是否显示标签云
tags_overview: false

# 首页展示最近文章
posts_overview:
  show_all_posts: false
  post_count: 5
  sort_updated: false

archive:
  sort_updated: false

post:
  show_updated: false

# 页脚版权年份
copyright:
  start_year: 2026
  end_year:

# 页脚顶部的两条小标签（留空或删除则不显示）
footer_badges:
  - text: 💐 布吉岛
    link: ''
  - text: 🍒 由 Hexo 驱动
    link: https://hexo.io

error_404:
  enabled: true
  title: "页面走丢了"
  description: "你访问的页面可能已被移动、改名或暂时不可用。"

##############################################################################
# 外观
##############################################################################

logo:
  enabled: true
  width: 50
  height: 50
  url: /images/logo.svg
  gravatar: false
  grayout: true

favicon:
  desktop:
    url: /images/logo.svg
    gravatar: false

highlight: github

# 内置配色：dark / light / classic / white
colorscheme: classic

# 正文区域最大宽度（rem）
page_width: 48

##############################################################################
# 其它
##############################################################################

rss: ''

